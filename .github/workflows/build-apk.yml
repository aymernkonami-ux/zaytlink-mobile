name: Build ZAYTLINK APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project and add our code
        run: |
          flutter create --org com.zaytlink --project-name zaytlink_app --platforms android app
          rm -rf app/lib
          cp -r lib app/lib
          cd app
          flutter pub add supabase_flutter battery_plus device_info_plus connectivity_plus crypto shared_preferences
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        run: |
          cd app
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: zaytlink-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

